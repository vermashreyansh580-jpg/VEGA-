name: VEGA Final Auto-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🏗️ Create Project Structure (v2 Fix)
        run: |
          # 1. Fresh Project with explicit android platform
          flutter create --platforms android --project-name vega_app build_env
          
          # 2. Add flet simply
          cd build_env
          flutter pub add flet
          
          # 3. Create folder for Kotlin
          mkdir -p android/app/src/main/kotlin/com/example/vega_app

      - name: 💉 INJECT GOD-LEVEL MANIFEST (XML)
        run: |
          MANIFEST="build_env/android/app/src/main/AndroidManifest.xml"
          
          cat <<EOF > $MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.vega_app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              
              <application 
                  android:label="VEGA GOD" 
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" 
                      android:exported="true" 
                      android:launchMode="singleTop" 
                      android:theme="@style/LaunchTheme" 
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" 
                      android:hardwareAccelerated="true" 
                      android:windowSoftInputMode="adjustResize">
                      
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                          
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: 💉 INJECT KOTLIN (Permission Logic)
        run: |
          KOTLIN_FILE="build_env/android/app/src/main/kotlin/com/example/vega_app/MainActivity.kt"
          
          cat <<EOF > $KOTLIN_FILE
          package com.example.vega_app
          import io.flutter.embedding.android.FlutterActivity
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity: FlutterActivity() {
              private val REQ_CODE = 123

              override fun onResume() {
                  super.onResume()
                  askGodPermissions()
              }

              private fun askGodPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val perms = arrayOf(
                          android.Manifest.permission.RECORD_AUDIO,
                          android.Manifest.permission.CAMERA,
                          android.Manifest.permission.READ_CONTACTS,
                          android.Manifest.permission.SEND_SMS,
                          android.Manifest.permission.CALL_PHONE,
                          android.Manifest.permission.ACCESS_FINE_LOCATION
                      )
                      
                      val missing = perms.filter {
                          ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                      }

                      if (missing.isNotEmpty()) {
                          ActivityCompat.requestPermissions(this, missing.toTypedArray(), REQ_CODE)
                      }
                  }
              }
          }
          EOF

      - name: 🚀 Build APK (Final Strike)
        run: |
          cd build_env
          flutter pub get
          # Building with no-sound-null-safety to avoid minor library issues
          flutter build apk --release --no-sound-null-safety

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-GOD-APK
          path: build_env/build/app/outputs/flutter-apk/app-release.apk
