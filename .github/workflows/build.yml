name: VEGA GOD MODE BUILD
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - uses: actions/setup-java@v3
        with: {distribution: 'temurin', java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable', flutter-version: '3.24.0'}

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build APK
        run: |
          # 🔥 FIX: Removed 'internet' & 'storage' flags (Flet adds Internet by default)
          # Only using valid flags: camera, microphone, location
          
          yes | flet build apk \
            --project vega_final \
            --module-name main \
            --target-arch arm64-v8a \
            --permissions camera microphone location \
            --description "VEGA AI OS - God Mode"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-GOD-MODE
          path: "**/*.apk"
