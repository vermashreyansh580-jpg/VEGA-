name: VEGA Final Auto-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: pip install flet groq plyer SpeechRecognition

      - name: 🏗️ Create Project Skeleton
        run: |
          # 1. Purana kachra saaf karo
          rm -rf build_env
          
          # 2. Flet ko "y" feed karo taaki wo prompt par na ruke
          echo "y" | flet build apk --project build_env --module-name main --verbose
          
          # 3. Assets folder ensure karo
          mkdir -p build_env/assets
          cp main.py build_env/assets/main.py

      - name: 💉 FIX Dart Entry Point (The Error Fix)
        run: |
          # Flet 0.80.5 ke liye naya Dart code
          cat <<EOF > build_env/lib/main.dart
          import 'package:flet/flet.dart';
          import 'package:flutter/material.dart';

          void main() async {
            // Naye version mein fletInit() use hota hai
            await fletInit();
            runApp(FletApp(
              pageUrl: "main.py", // Assets se python dhoondega
              assetsDir: "assets",
            ));
          }
          EOF

      - name: 💉 INJECT GOD-LEVEL MANIFEST (XML)
        run: |
          MANIFEST="build_env/android/app/src/main/AndroidManifest.xml"
          cat <<EOF > $MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              
              <application android:label="VEGA" android:icon="@mipmap/ic_launcher" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: 💉 INJECT KOTLIN (Native Permissions)
        run: |
          KOTLIN_FILE="build_env/android/app/src/main/kotlin/com/example/app/MainActivity.kt"
          mkdir -p $(dirname $KOTLIN_FILE)
          cat <<EOF > $KOTLIN_FILE
          package com.example.app
          import io.flutter.embedding.android.FlutterActivity
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity: FlutterActivity() {
              override fun onResume() {
                  super.onResume()
                  val p = arrayOf(
                      android.Manifest.permission.RECORD_AUDIO,
                      android.Manifest.permission.CAMERA,
                      android.Manifest.permission.READ_CONTACTS,
                      android.Manifest.permission.SEND_SMS,
                      android.Manifest.permission.CALL_PHONE,
                      android.Manifest.permission.ACCESS_FINE_LOCATION
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      ActivityCompat.requestPermissions(this, p, 101)
                  }
              }
          }
          EOF

      - name: 🚀 Final APK Build
        run: |
          cd build_env
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-ULTIMATE-APK
          path: build_env/build/app/outputs/flutter-apk/app-release.apk
