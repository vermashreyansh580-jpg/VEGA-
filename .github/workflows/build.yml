name: VEGA Final Black-Screen Fix
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🏗️ Create Project & Arrange Files
        run: |
          # 1. Clean Slate
          rm -rf build_env
          
          # 2. Create Flutter Project
          flutter create --platforms android --project-name vega_app build_env
          
          # 3. Assets folder banao aur Python file copy karo
          mkdir -p build_env/assets
          cp main.py build_env/assets/main.py
          
          echo "✅ Project Created & Main.py Copied."

      - name: 📝 FORCE WRITE pubspec.yaml (Crucial Fix)
        run: |
          # Hum default pubspec ko uda kar apna wala daal rahe hain
          # Taaki 'assets' section 100% sahi ho
          
          cat <<EOF > build_env/pubspec.yaml
          name: vega_app
          description: A new Flutter project.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flet: ^0.22.0  # Stable version for loading Python
            cupertino_icons: ^1.0.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^2.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/main.py  # 🔥 YE LINE BLACK SCREEN HATAYEGI
          EOF
          echo "✅ pubspec.yaml Overwritten with Assets."

      - name: 💉 FORCE WRITE main.dart (The Loader)
        run: |
          cat <<EOF > build_env/lib/main.dart
          import 'package:flet/flet.dart';
          import 'package:flutter/material.dart';

          void main() async {
            // Ensure bindings are initialized
            WidgetsFlutterBinding.ensureInitialized();
            
            runApp(const FletApp(
              pageUrl: "assets/main.py", // Asset path must match pubspec
              assetsDir: "assets",
              title: "VEGA AI",
            ));
          }
          EOF
          echo "✅ main.dart Injected."

      - name: 💉 INJECT MANIFEST (Permissions)
        run: |
          MANIFEST="build_env/android/app/src/main/AndroidManifest.xml"
          cat <<EOF > $MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.vega_app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              
              <application android:label="VEGA" android:icon="@mipmap/ic_launcher" android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" 
                      android:exported="true" 
                      android:launchMode="singleTop" 
                      android:theme="@style/LaunchTheme" 
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" 
                      android:hardwareAccelerated="true" 
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

      - name: 💉 INJECT KOTLIN (Auto-Permission)
        run: |
          KOTLIN_FILE="build_env/android/app/src/main/kotlin/com/example/vega_app/MainActivity.kt"
          mkdir -p $(dirname $KOTLIN_FILE)
          cat <<EOF > $KOTLIN_FILE
          package com.example.vega_app
          import io.flutter.embedding.android.FlutterActivity
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.ActivityCompat

          class MainActivity: FlutterActivity() {
              override fun onResume() {
                  super.onResume()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val p = arrayOf(
                          android.Manifest.permission.RECORD_AUDIO,
                          android.Manifest.permission.CAMERA,
                          android.Manifest.permission.READ_CONTACTS,
                          android.Manifest.permission.SEND_SMS,
                          android.Manifest.permission.CALL_PHONE
                      )
                      ActivityCompat.requestPermissions(this, p, 101)
                  }
              }
          }
          EOF

      - name: 🚀 Final Build
        run: |
          cd build_env
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-FINAL-APK
          path: build_env/build/app/outputs/flutter-apk/app-release.apk
