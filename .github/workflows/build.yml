name: VEGA Final System
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # 🔥 CRITICAL FIX: Flutter 3.24.0 use kar rahe hain jo sabse stable hai
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Install Flet CLI
        run: pip install flet

      # ---------------------------------------------------------
      # STEP 1: UI FILE (index.html) - Neon Reactor UI
      # ---------------------------------------------------------
      - name: 📝 Create assets/index.html
        run: |
          mkdir -p assets
          cat <<EOF > assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                  body { 
                      background-color: black; 
                      display: flex; 
                      flex-direction: column;
                      justify-content: center; 
                      align-items: center; 
                      height: 100vh; 
                      margin: 0; 
                      overflow: hidden;
                      font-family: 'Courier New', monospace;
                  }
                  .reactor-container {
                      position: relative;
                      width: 300px;
                      height: 300px;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                  }
                  .reactor-ring {
                      position: absolute;
                      width: 100%;
                      height: 100%;
                      border: 4px solid #00ff00;
                      border-radius: 50%;
                      box-shadow: 0 0 20px #00ff00, inset 0 0 20px #00ff00;
                      animation: spin 4s linear infinite;
                  }
                  .reactor-core {
                      width: 150px;
                      height: 150px;
                      background: radial-gradient(circle, #ffffff 10%, #00ff00 90%);
                      border-radius: 50%;
                      box-shadow: 0 0 50px #00ff00, 0 0 100px #00ff00;
                      animation: pulse 2s infinite ease-in-out;
                  }
                  h1 { color: #00ff00; margin-top: 50px; text-shadow: 0 0 10px #00ff00; letter-spacing: 5px; }
                  
                  @keyframes spin { 100% { transform: rotate(360deg); } }
                  @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
              </style>
          </head>
          <body>
              <div class="reactor-container">
                  <div class="reactor-ring"></div>
                  <div class="reactor-core"></div>
              </div>
              <h1>VEGA ONLINE</h1>
          </body>
          </html>
          EOF

      # ---------------------------------------------------------
      # STEP 2: REQUIREMENTS (Dependencies)
      # ---------------------------------------------------------
      - name: 📝 Create requirements.txt
        run: |
          # Ye libraries phone ke andar install hongi
          cat <<EOF > requirements.txt
          flet
          groq
          SpeechRecognition
          gTTS
          requests
          EOF

      # ---------------------------------------------------------
      # STEP 3: THE BRAIN (main.py)
      # ---------------------------------------------------------
      - name: 📝 Create main.py
        run: |
          cat <<EOF > main.py
          import flet as ft
          import os
          
          def main(page: ft.Page):
              page.title = "VEGA"
              page.bgcolor = "black"
              page.padding = 0
              
              # HTML ko load karna
              # Mobile mein assets folder root par hota hai
              html_content = "<h1>Error Loading UI</h1>"
              try:
                  with open("assets/index.html", "r") as f:
                      html_content = f.read()
              except Exception as e:
                  html_content = f"<h1>Error: {e}</h1>"

              webview = ft.WebView(
                  html=html_content,
                  expand=True
              )
              
              page.add(webview)
              
              # --- BRAIN CHECK ---
              # Hum check karenge ki libraries load ho rahi hain ya nahi
              try:
                  import groq
                  import speech_recognition
                  print("✅ All Systems Operational")
              except ImportError as e:
                  print(f"❌ System Failure: {e}")
                  page.snack_bar = ft.SnackBar(ft.Text(f"Missing Lib: {e}"))
                  page.snack_bar.open = True
                  page.update()

          ft.app(target=main, assets_dir="assets")
          EOF

      # ---------------------------------------------------------
      # STEP 4: FINAL BUILD (Flet CLI)
      # ---------------------------------------------------------
      - name: 🚀 Build APK (Correct Command)
        run: |
          # Hum Flet CLI use kar rahe hain kyunki ye automatically 
          # Flutter Project banata hai aur Python Libraries pack karta hai.
          # '--permissions' flag saari permissions Manifest mein daal dega.
          
          yes | flet build apk \
            --project vega_app \
            --module-name main \
            --include-packages flet,groq,SpeechRecognition,gTTS,requests \
            --permissions android.permission.RECORD_AUDIO,android.permission.INTERNET,android.permission.CAMERA,android.permission.SEND_SMS,android.permission.READ_SMS,android.permission.CALL_PHONE,android.permission.READ_CONTACTS \
            --description "Vega AI Assistant"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-ULTIMATE-APK
          path: build/app/outputs/flutter-apk/app-release.apk
