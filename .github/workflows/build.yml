name: VEGA Final Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'

      - name: Install Flet
        run: pip install flet

      # ---------------------------------------------------------
      # STEP 1: UI FILE
      # ---------------------------------------------------------
      - name: 📝 Create assets/index.html
        run: |
          mkdir -p assets
          cat <<EOF > assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                  body { 
                      background-color: black; 
                      display: flex; 
                      flex-direction: column;
                      justify-content: center; 
                      align-items: center; 
                      height: 100vh; 
                      margin: 0; 
                      overflow: hidden;
                      font-family: monospace;
                  }
                  .reactor {
                      width: 250px;
                      height: 250px;
                      border: 5px solid #00ff00;
                      border-radius: 50%;
                      box-shadow: 0 0 50px #00ff00, inset 0 0 20px #00ff00;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      animation: pulse 2s infinite;
                  }
                  .core {
                      width: 150px;
                      height: 150px;
                      background: radial-gradient(circle, #fff 10%, #00ff00 90%);
                      border-radius: 50%;
                      box-shadow: 0 0 80px #00ff00;
                  }
                  h1 { color: #00ff00; margin-top: 30px; letter-spacing: 5px; text-shadow: 0 0 10px #00ff00; }
                  @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
              </style>
          </head>
          <body>
              <div class="reactor"><div class="core"></div></div>
              <h1>VEGA ONLINE</h1>
          </body>
          </html>
          EOF

      # ---------------------------------------------------------
      # STEP 2: REQUIREMENTS (Dependencies)
      # ---------------------------------------------------------
      - name: 📝 Create requirements.txt
        run: |
          cat <<EOF > requirements.txt
          flet
          groq
          SpeechRecognition
          gTTS
          requests
          EOF

      # ---------------------------------------------------------
      # STEP 3: BRAIN (main.py)
      # ---------------------------------------------------------
      - name: 📝 Create main.py
        run: |
          cat <<EOF > main.py
          import flet as ft
          
          def main(page: ft.Page):
              page.title = "VEGA"
              page.bgcolor = "black"
              page.padding = 0
              
              # Load UI
              html_content = "<h1>Loading...</h1>"
              try:
                  with open("assets/index.html", "r") as f:
                      html_content = f.read()
              except:
                  pass

              webview = ft.WebView(html=html_content, expand=True)
              page.add(webview)
              
              # Dependencies Check
              try:
                  import groq
                  import speech_recognition
                  print("✅ Brain Loaded")
              except ImportError as e:
                  print(f"❌ Error: {e}")

          ft.app(target=main, assets_dir="assets")
          EOF

      # ---------------------------------------------------------
      # STEP 4: BUILD APK
      # ---------------------------------------------------------
      - name: 🚀 Build APK
        run: |
          # Flet CLI se APK bana rahe hain
          yes | flet build apk \
            --project vega_app \
            --module-name main \
            --permissions camera microphone location \
            --description "Vega AI Assistant"

      # ---------------------------------------------------------
      # STEP 5: UPLOAD (PATH FIXED HERE)
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-FINAL-APK
          # 🔥 FIX: Path mein 'vega_app/' add kiya hai
          path: vega_app/build/app/outputs/flutter-apk/app-release.apk
