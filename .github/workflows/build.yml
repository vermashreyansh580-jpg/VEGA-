name: VEGA Final Auto-Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🏗️ Create Project Structure
        run: |
          # Fresh Project create karo
          flutter create --platforms android --project-name vega_app build_env
          
          cd build_env
          # Flet ki latest stable version add karo jo null-safe ho
          flutter pub add flet
          
          # Kotlin package folder banao
          mkdir -p android/app/src/main/kotlin/com/example/vega_app

      - name: 💉 INJECT GOD-LEVEL MANIFEST (XML)
        run: |
          MANIFEST="build_env/android/app/src/main/AndroidManifest.xml"
          
          cat <<EOF > $MANIFEST
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.vega_app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              
              <application 
                  android:label="VEGA GOD" 
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity android:name=".MainActivity" 
                      android:exported="true" 
                      android:launchMode="singleTop" 
                      android:theme="@style/LaunchTheme" 
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" 
                      android:hardwareAccelerated="true" 
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 💉 INJECT KOTLIN (Native Permission Popup)
        run: |
          KOTLIN_FILE="build_env/android/app/src/main/kotlin/com/example/vega_app/MainActivity.kt"
          
          cat <<EOF > $KOTLIN_FILE
          package com.example.vega_app
          import io.flutter.embedding.android.FlutterActivity
          import android.content.pm.PackageManager
          import android.os.Build
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity: FlutterActivity() {
              private val RC = 123
              override fun onResume() {
                  super.onResume()
                  val p = arrayOf(
                      android.Manifest.permission.RECORD_AUDIO,
                      android.Manifest.permission.CAMERA,
                      android.Manifest.permission.READ_CONTACTS,
                      android.Manifest.permission.SEND_SMS,
                      android.Manifest.permission.CALL_PHONE
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      ActivityCompat.requestPermissions(this, p, RC)
                  }
              }
          }
          EOF

      - name: 🚀 Build APK (Clean & Strike)
        run: |
          cd build_env
          flutter pub get
          # Null-safety flag hata diya hai kyunki naya Flutter ise support nahi karta
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-GOD-APK
          path: build_env/build/app/outputs/flutter-apk/app-release.apk
